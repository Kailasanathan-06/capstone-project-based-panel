<!DOCTYPE html>{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not Found - SecureDT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body data-theme="dark" class="auth-page">
<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <h1 class="auth-title">404 &mdash; Page not found</h1>
      <p class="auth-sub muted">The resource you requested does not exist on this SecureDT instance.</p>
    </div>
    <a href="/" class="btn btn-primary block">Return to dashboard</a>
  </div>
</main>
