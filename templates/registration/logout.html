<!DOCTYPE html>{% load static %}
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signed Out - SecureDT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body data-theme="dark" class="auth-page">

<main class="auth-shell">
  <div class="auth-visual" aria-hidden="true">
    <div class="auth-brand-lockup">
      <span class="brand-icon" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none">
          <rect x="4" y="4" width="24" height="24" rx="6" stroke="currentColor" stroke-width="2"/>
          <path d="M10 16L14 20L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="auth-wordmark">SecureDT</span>
    </div>
  </div>

  <div class="auth-card">
    <div class="auth-brand">
      <h1 class="auth-title">You have signed out</h1>
      <p class="auth-sub muted">Your session is closed and your MEC fleet stays safe.</p>
    </div>
    <a href="{% url 'login' %}" class="btn btn-primary block">Sign back in</a>
    <div class="auth-foot muted small">
      Or continue as a guest &middot; <a href="/">View the public dashboard</a>
    </div>
  </div>
</main>
</body>
</html>
